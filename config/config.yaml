data_dir: "/datasets/work/hb-nhmrc-dhcp/work/liu275/Depression/DVLOG_Feature"
train_gender: both
test_gender: both

model: DepMamba
dataset: dvlog #dvlog or lmvd
train: true
epochs: 120
batch_size: 16
learning_rate: 8e-5
lr_scheduler: cos
if_wandb: false
save_dir: "/datasets/work/hb-nhmrc-dhcp/work/liu275/Depression/DepMamba/mambamodels"
device:
  - "cuda"

# Mamba parameters
mmmamba:
  audio_input_size: 25 # LDDs for D-Vlog
  video_input_size: 136
  mm_input_size: 128
  mm_output_sizes: [128]
  dropout: 0.4
  d_ffn: 1024 
  num_layers: 4
  activation: 'GELU'
  causal: false

  mamba_config:
    d_state: 12 
    expand: 4 
    d_conv: 4 
    bidirectional: true

mmmamba_lmvd:
  audio_input_size: 128 # VGGish for LMVD
  video_input_size: 136
  mm_input_size: 128
  mm_output_sizes: [128]
  dropout: 0.4
  d_ffn: 1024 
  num_layers: 4
  activation: 'GELU'
  causal: false

  mamba_config:
    d_state: 16 
    expand: 4 
    d_conv: 4 
    bidirectional: true   
